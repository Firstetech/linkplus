version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gobiz_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=gobiz
      - DB_USERNAME=gobizuser
      - DB_PASSWORD=gobizpass
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: gobiz_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gobiz
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: gobizuser
      MYSQL_PASSWORD: gobizpass
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db_data:

